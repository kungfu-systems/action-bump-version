name: Release - New Version

on:
  pull_request:
    types: [closed]
    branches:
      - alpha/v*/v*
      - release/v*/v*

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

jobs:
  release:
    uses: kungfu-systems/workflows/.github/workflows/.release-new-version.yml@dev/v2/v2.0
    with:
      publish-aws-ci: false
      publish-aws-user: false
      action-bump-version-ref: dev/v4/v4.0
