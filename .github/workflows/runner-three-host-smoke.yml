# SPDX-License-Identifier: Apache-2.0

name: Runner - Three Host Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - feature/runner-smoke-three-hosts

permissions:
  contents: read

jobs:
  mac-studio:
    name: mac-studio smoke
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - mac-studio
      - kungfu-build
      - kungfu-build-v4-macos-arm64
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify runner route
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_NAME}" = "mac-studio-kungfu-systems"
          test "${RUNNER_OS}" = "macOS"
          test "${RUNNER_ARCH}" = "ARM64"
          whoami
          pwd

      - name: Verify tool inventory
        shell: bash
        run: |
          set -euo pipefail
          for tool in go actionlint fnm node yarn python3 uv conan cmake ninja; do
            command -v "$tool"
          done
          go version
          actionlint -version
          fnm --version
          node --version
          yarn --version
          python3 --version
          uv --version
          conan --version
          cmake --version | head -n 1
          ninja --version
          xcode-select -p

      - name: Verify ABV action entrypoints
        shell: bash
        run: |
          set -euo pipefail
          test -f action.yml
          test -f cli.js
          test -f index.js
          test -f dist/index.js
          node --check cli.js
          node --check index.js
          node --check dist/index.js

      - name: Verify runner paths
        shell: bash
        run: |
          set -euo pipefail
          test -d /Users/gha-runner/actions-runner/kungfu-systems/_work
          test -d /Users/gha-runner/Worktrees/kungfu
          test -d /Users/gha-runner/.cache/kungfu
          df -Pk /Users/gha-runner | awk 'NR==2 { if ($4 < 120*1024*1024) exit 1; print }'

  darkhero:
    name: darkhero smoke
    runs-on:
      - self-hosted
      - Windows
      - X64
      - darkhero
      - kungfu-build
      - kungfu-build-v4-windows-x64
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify runner route
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:RUNNER_NAME -ne "darkhero-kungfu-systems") { throw "unexpected runner $env:RUNNER_NAME" }
          if ($env:RUNNER_OS -ne "Windows") { throw "unexpected os $env:RUNNER_OS" }
          if ($env:RUNNER_ARCH -ne "X64") { throw "unexpected arch $env:RUNNER_ARCH" }
          whoami
          Get-Location

      - name: Verify tool inventory
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($tool in @("go", "actionlint", "fnm", "node", "yarn", "python", "uv", "conan", "cmake", "ninja")) {
            $cmd = Get-Command $tool -ErrorAction SilentlyContinue
            if (-not $cmd) { throw "missing tool $tool" }
            "$tool=$($cmd.Source)"
          }
          go version
          actionlint -version
          fnm --version
          node --version
          yarn --version
          python --version
          uv --version
          conan --version
          cmake --version | Select-Object -First 1
          ninja --version

      - name: Verify ABV action entrypoints
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($path in @("action.yml", "cli.js", "index.js", "dist/index.js")) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "missing $path" }
          }
          node --check cli.js
          node --check index.js
          node --check dist/index.js

      - name: Verify runner paths
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($path in @(
            "C:\actions-runner\kungfu-systems\_work",
            "C:\Users\gha-runner\Worktrees\kungfu",
            "C:\kungfu-cache",
            "C:\tmp"
          )) {
            if (-not (Test-Path -LiteralPath $path -PathType Container)) { throw "missing path $path" }
          }
          $free = (Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='C:'").FreeSpace
          if ($free -lt 107374182400) { throw "low disk free bytes=$free" }
          $free

  server-101:
    name: server-101 smoke
    runs-on:
      - self-hosted
      - Windows
      - X64
      - server-101
      - windows-x64
      - kungfu-build
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify runner route
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:RUNNER_NAME -ne "server-101-kungfu-systems") { throw "unexpected runner $env:RUNNER_NAME" }
          if ($env:RUNNER_OS -ne "Windows") { throw "unexpected os $env:RUNNER_OS" }
          if ($env:RUNNER_ARCH -ne "X64") { throw "unexpected arch $env:RUNNER_ARCH" }
          whoami
          Get-Location

      - name: Verify tool inventory
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($tool in @("go", "actionlint", "fnm", "node", "yarn", "python", "uv", "conan", "cmake", "ninja")) {
            $cmd = Get-Command $tool -ErrorAction SilentlyContinue
            if (-not $cmd) { throw "missing tool $tool" }
            "$tool=$($cmd.Source)"
          }
          go version
          actionlint -version
          fnm --version
          node --version
          yarn --version
          python --version
          uv --version
          conan --version
          cmake --version | Select-Object -First 1
          ninja --version

      - name: Verify ABV action entrypoints
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($path in @("action.yml", "cli.js", "index.js", "dist/index.js")) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "missing $path" }
          }
          node --check cli.js
          node --check index.js
          node --check dist/index.js

      - name: Verify runner paths
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($path in @(
            "C:\actions-runner\kungfu-systems\_work",
            "C:\Users\gha-runner\Worktrees\kungfu",
            "C:\kungfu-cache",
            "C:\tmp"
          )) {
            if (-not (Test-Path -LiteralPath $path -PathType Container)) { throw "missing path $path" }
          }
          $free = (Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='C:'").FreeSpace
          if ($free -lt 107374182400) { throw "low disk free bytes=$free" }
          $free
